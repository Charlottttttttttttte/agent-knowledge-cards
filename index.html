<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF7F2">
<title>Agent AI 学习课程</title>
<style>
  :root{--paper:#F8F1DC;--primary:#4A3F30;--accent:#C0523C;--ink:#3D3226;--gray:#8A7A5C;--soft:#EBD9A8;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--paper);font-family:"PingFang SC",sans-serif;overscroll-behavior:none;}
  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;z-index:20;background:linear-gradient(rgba(250,247,242,.95),rgba(250,247,242,0));}
  .title{font-size:15px;font-weight:700;color:var(--primary);}
  select{font-size:14px;color:var(--gray);background:transparent;border:1px solid #ddd;border-radius:6px;padding:3px 6px;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #page{max-width:100vw;max-height:100vh;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .18s;}
  #page.loading{opacity:.35;}
  .zone{position:fixed;top:0;bottom:0;width:30%;z-index:10;}
  .navbtn{position:fixed;top:50%;transform:translateY(-50%);z-index:25;width:52px;height:52px;border-radius:50%;
    border:2px solid rgba(248,241,220,.7);background:rgba(74,63,48,.55);color:#F8F1DC;font-size:24px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
    box-shadow:0 2px 8px rgba(0,0,0,.25);touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  .navbtn:active{background:rgba(74,63,48,.85);}
  #prevBtn{left:12px;} #nextBtn{right:12px;}
  .today-tag{display:inline-block;font-size:13px;color:var(--accent);background:rgba(255,255,255,.6);
    border:1px dashed var(--accent);border-radius:10px;padding:2px 8px;margin-left:8px;}
  #prev{left:0;} #next{right:0;}
  #ind{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;text-align:center;
    font-size:13px;color:var(--gray);z-index:20;letter-spacing:1px;}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--gray);font-size:15px;padding:40px;text-align:center;}
  /* 自测页 */
  #quiz{position:fixed;inset:0;display:none;flex-direction:column;background:var(--paper);z-index:15;
    padding:calc(env(safe-area-inset-top) + 70px) 28px calc(env(safe-area-inset-bottom) + 60px);overflow-y:auto;}
  .qtag{font-size:14px;font-weight:700;letter-spacing:3px;color:var(--primary);margin-bottom:18px;}
  .qtext{font-size:21px;font-weight:700;line-height:1.6;margin-bottom:28px;}
  .opt{display:flex;align-items:center;gap:14px;border:2px solid rgba(30,30,30,.3);border-radius:12px;
    padding:16px 18px;margin-bottom:14px;font-size:17px;line-height:1.5;background:#fff;}
  .optnum{font-weight:700;color:var(--primary);flex:0 0 24px;font-size:18px;}
  .opt.right{border-color:var(--primary);background:var(--soft);}
  .opt.wrong{border-color:var(--accent);background:#FBEAE3;}
  .opt.dim{opacity:.45;}
  .verdict{display:none;margin-top:10px;}
  .vhead{font-size:19px;font-weight:900;margin-bottom:10px;}
  .vhead.ok{color:var(--primary);}
  .vhead.no{color:var(--accent);}
  .vexp{font-size:15px;color:var(--ink);line-height:1.7;border-top:1px solid rgba(30,30,30,.15);padding-top:14px;}
  .vbtn{display:block;margin:26px auto 0;padding:13px 44px;font-size:16px;font-weight:700;color:#fff;
    background:var(--primary);border:none;border-radius:24px;}
  /* 成绩页 */
  .hbtn{font-size:14px;color:var(--gray);background:transparent;border:1px solid #ddd;border-radius:6px;padding:4px 10px;margin-right:8px;}
  #stats{position:fixed;inset:0;display:none;flex-direction:column;background:var(--paper);z-index:40;
    padding:calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 28px);overflow-y:auto;}
  .stitle{font-size:22px;font-weight:900;color:var(--primary);margin-bottom:6px;}
  .ssub{font-size:14px;color:var(--gray);line-height:1.7;margin-bottom:22px;}
  .srow{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(30,30,30,.12);
    padding:13px 2px;font-size:17px;}
  .srow b{color:var(--primary);}
  .srow .bad{color:var(--accent);font-size:14px;margin-top:4px;line-height:1.5;}
  .sempty{color:var(--gray);font-size:15px;text-align:center;margin-top:60px;line-height:2;}
  /* Wiki 拓展页 */
  #extra{position:fixed;inset:0;display:none;flex-direction:column;background:var(--paper);z-index:15;
    padding:calc(env(safe-area-inset-top) + 70px) 28px calc(env(safe-area-inset-bottom) + 60px);overflow-y:auto;}
  .xtag{font-size:14px;font-weight:700;letter-spacing:3px;color:var(--accent);margin-bottom:6px;}
  .xtitle{font-size:22px;font-weight:900;color:var(--primary);margin-bottom:6px;}
  .xsub{font-size:13px;color:var(--gray);line-height:1.7;margin-bottom:22px;}
  .xcard{background:#fffdf4;border:2px solid rgba(74,63,48,.28);border-radius:12px;
    padding:14px 16px 12px;margin-bottom:12px;}
  .xcard-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .xcard-name{font-size:16px;font-weight:700;color:var(--primary);}
  .xcard-link{font-size:12px;color:var(--accent);white-space:nowrap;text-decoration:none;border:1px solid var(--accent);border-radius:8px;padding:2px 8px;}
  .xcard-desc{font-size:14px;color:var(--ink);line-height:1.65;opacity:.85;}
  /* 拓展页时隐藏两侧翻页箭头，避免遮挡卡片 */
  body.showing-extra #prevBtn, body.showing-extra #nextBtn{display:none;}
</style>
</head>
<body>
<header>
  <span class="title" id="dtitle">Agent AI 学习课程</span>
  <span>
    <button class="hbtn" id="todayBtn" onclick="goToday()">今日</button>
    <button class="hbtn" onclick="showStats()">成绩</button>
    <select id="picker" onchange="pinDay(+this.value)"></select>
  </span>
</header>
<div id="stage"><img id="page" alt=""></div>
<div id="quiz"></div>
<div id="extra"></div>
<div id="stats"></div>
<div class="zone" id="prev" onclick="nav(-1)"></div>
<div class="zone" id="next" onclick="nav(1)"></div>
<button class="navbtn" id="prevBtn" onclick="nav(-1)" aria-label="上一页">‹</button>
<button class="navbtn" id="nextBtn" onclick="nav(1)" aria-label="下一页">›</button>
<div id="ind"></div>
<div id="err">课程内容加载失败，检查网络后刷新</div>
<script>
let manifest=null, dayIdx=-1, seq=[], pos=0, touchX=0;
const img=document.getElementById('page'), quizEl=document.getElementById('quiz'), extraEl=document.getElementById('extra');

async function boot(){
  try{
    const r=await fetch('manifest.json?'+Date.now());
    manifest=await r.json();
    const sel=document.getElementById('picker');
    manifest.days.forEach((d,i)=>{
      const o=document.createElement('option');
      o.value=i; o.textContent='Day '+d.day+' · '+d.title;
      sel.appendChild(o);
    });
    goDay(resolveStartDay());
  }catch(e){ document.getElementById('err').style.display='flex'; }
}

/* ===== 今日进度 / 手动固定 ===== */
function courseStart(){
  try{ const s=localStorage.getItem('agent-start'); if(s) return new Date(s); }catch(e){}
  return new Date('2026-08-10T00:00:00');   // 课程开课日（默认 2026-08-10，可改 localStorage agent-start）
}
function expectedDay(){
  const start=courseStart();
  const today=new Date(); today.setHours(0,0,0,0);
  const elapsed=Math.floor((today-start)/86400000)+1;
  return Math.max(1, Math.min(manifest.days.length, elapsed));
}
function loadPin(){
  try{ const v=localStorage.getItem('agent-pin'); return v?parseInt(v,10):0; }catch(e){ return 0; }
}
function resolveStartDay(){
  const pin=loadPin();
  return pin ? pin-1 : expectedDay()-1;     // 手动固定优先，否则按日期推进
}
function pinDay(i){                          // 下拉手动选择：固定并记住
  try{ localStorage.setItem('agent-pin', String(i+1)); }catch(e){}
  goDay(i);
}
function goToday(){                          // 回到按日期推进的今日进度
  try{ localStorage.removeItem('agent-pin'); }catch(e){}
  goDay(expectedDay()-1);
}

async function goDay(i){
  dayIdx=i; document.getElementById('picker').value=i;
  const day=manifest.days[dayIdx];
  let imgs=[], quizzes=[], extras=[];
  try{
    const cfg=await (await fetch('days/'+day.dir+'/quiz.json?'+Date.now())).json();
    if(Array.isArray(cfg)) quizzes=cfg;
    else { imgs=cfg.images||[]; quizzes=cfg.quizzes||[]; extras=cfg.extras||[]; }
  }catch(e){}
  if(!imgs.length) for(let p=1;p<=day.pages;p++) imgs.push('page-'+String(p).padStart(2,'0')+'.png');
  seq=imgs.map(s=>({type:'img',src:'days/'+day.dir+'/'+s}));
  // quizzes: [{after: 第N张图之后(1-based), q, options, answer(0-based), explain}]，多题同位置按顺序排
  quizzes.sort((a,b)=>a.after-b.after);
  let off=0;
  quizzes.forEach(q=>seq.splice(Math.min(q.after+off++,seq.length),0,{type:'quiz',...q}));
  // Wiki 拓展：作为最后一屏
  if(extras && extras.length) seq.push({type:'extra', items:extras});
  pos=0; render();
  // 后台预加载当天全部图片，翻页时直接从缓存出图
  seq.forEach(it=>{ if(it.type==='img'){ const im=new Image(); im.src=it.src; } });
}

function nav(d){
  if(document.getElementById('quiz').style.display==='flex'||document.getElementById('extra').style.display==='flex') return; // 答题/拓展页禁止翻页
  pos=Math.min(Math.max(pos+d,0),seq.length-1);
  render();
}

function render(){
  const item=seq[pos], day=manifest.days[dayIdx];
  document.getElementById('dtitle').textContent='Day '+day.day+' · '+day.title;
  const tag=(dayIdx===expectedDay()-1)?'<span class="today-tag">今日 · Day '+day.day+'</span> ':'';
  document.getElementById('ind').innerHTML=tag+(pos+1)+' / '+seq.length;
  if(item.type==='img'){
    quizEl.style.display='none'; extraEl.style.display='none'; img.style.display='block';
    if(img.getAttribute('src')!==item.src){
      img.classList.add('loading');
      img.onload=()=>img.classList.remove('loading');
      img.onerror=()=>img.classList.remove('loading');
      img.src=item.src;
    }
  }else if(item.type==='extra'){
    img.style.display='none'; quizEl.style.display='none';
    renderExtra(item);
  }else{
    img.style.display='none'; extraEl.style.display='none';
    renderQuiz(item);
  }
}

function closeExtra(){ extraEl.style.display='none'; document.body.classList.remove('showing-extra'); nav(1); }

function renderExtra(item){
  document.body.classList.add('showing-extra');
  extraEl.style.display='flex';
  extraEl.innerHTML=
    '<div class="xtag">📎 拓展 · LLM-WIKI</div>'+
    '<div class="xtitle">想深入再看的关联概念</div>'+
    '<p class="xsub">卡片只讲了一个点；下面是你在 Wiki 里消化过、和今天相关但没展开的内容。点「去读」跳到 Obsidian 原文。</p>'+
    item.items.map(x=>'<div class="xcard">'+
      '<div class="xcard-head"><span class="xcard-name">'+x.name+'</span>'+
      '<a class="xcard-link" href="'+x.link+'">去读 ↗</a></div>'+
      '<div class="xcard-desc">'+x.desc+'</div></div>').join('')+
    '<button class="vbtn" onclick="closeExtra()">继续 →</button>';
}

function renderQuiz(item){
  quizEl.style.display='flex';
  quizEl.innerHTML=
    '<div class="qtag">❓ 自测</div>'+
    '<div class="qtext">'+item.q+'</div>'+
    item.options.map((o,i)=>'<div class="opt" data-i="'+i+'"><span class="optnum">'+(i+1)+'</span><span>'+o+'</span></div>').join('')+
    '<div class="verdict" id="verdict"></div>';
  let answered=false;
  quizEl.querySelectorAll('.opt').forEach(el=>{
    el.onclick=()=>{
      if(answered) return; answered=true;
      const pick=+el.dataset.i, ok=pick===item.answer;
      saveResult(item, ok);
      quizEl.querySelectorAll('.opt').forEach(o2=>{
        const oi=+o2.dataset.i;
        if(oi===item.answer) o2.classList.add('right');
        else if(oi===pick) o2.classList.add('wrong');
        else o2.classList.add('dim');
      });
      const v=document.getElementById('verdict');
      v.style.display='block';
      v.innerHTML='<div class="vhead '+(ok?'ok':'no')+'">'+(ok?'✅ 答对了':'❌ 答错了')+'</div>'+
        '<div class="vexp">'+item.explain+'</div>'+
        '<button class="vbtn" onclick="closeQuiz()">'+(pos<seq.length-1?'继续 →':'完成 🎉')+'</button>';
      v.scrollIntoView({behavior:'smooth'});
    };
  });
}
function closeQuiz(){ quizEl.style.display='none'; nav(1); }

/* ===== 成绩记录与成绩页 ===== */
function loadResults(){ try{return JSON.parse(localStorage.getItem('agent-results')||'{}');}catch(e){return {};} }
function saveResult(item, ok){
  try{
    const day=manifest.days[dayIdx];
    const all=loadResults();
    const key='day'+String(day.day).padStart(2,'0');
    const r=all[key]||{day:day.day,title:day.title,answers:{}};
    r.answers[item.q]=ok?'1':'0';   // 同一题重答覆盖旧记录
    r.ts=Date.now();
    all[key]=r;
    localStorage.setItem('agent-results',JSON.stringify(all));
  }catch(e){}
}
function buildReport(){
  const all=loadResults(), keys=Object.keys(all).sort();
  const now=new Date(), pad=n=>String(n).padStart(2,'0');
  let txt='## 网页自测成绩（'+now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'）\n';
  keys.forEach(k=>{
    const r=all[k], qs=Object.keys(r.answers);
    const correct=qs.filter(q=>r.answers[q]==='1');
    const wrong=qs.filter(q=>r.answers[q]==='0');
    txt+='\n- Day '+r.day+' · '+r.title+'：'+correct.length+'/'+qs.length;
    wrong.forEach(q=>{ txt+='（错：'+q+'）'; });
  });
  return keys.length?txt:'（还没有答题记录）';
}
function showStats(){
  const all=loadResults(), keys=Object.keys(all).sort();
  const el=document.getElementById('stats');
  let html='<div class="stitle">📊 我的自测成绩</div>'+
    '<div class="ssub">成绩只存在这台手机的浏览器里。点「同步到 Obsidian」自动写入 Agent-AI课程/成绩.md（需 Advanced URI 插件）；每周复盘日会读取并做个性化复盘。</div>';
  if(!keys.length){
    html+='<div class="sempty">还没有答题记录<br>回到课程里答几道题就有了</div>';
  }else{
    keys.forEach(k=>{
      const r=all[k], qs=Object.keys(r.answers);
      const correct=qs.filter(q=>r.answers[q]==='1').length;
      const wrong=qs.filter(q=>r.answers[q]==='0');
      html+='<div class="srow"><span>Day '+r.day+' · '+r.title+'</span><b>'+correct+' / '+qs.length+'</b></div>';
      wrong.forEach(q=>{ html+='<div class="srow" style="border:none;padding-top:0"><span class="bad">错：'+q+'</span></div>'; });
    });
  }
  html+='<button class="vbtn" onclick="syncToObsidian()">同步到 Obsidian</button>'+
        '<button class="vbtn" style="background:#fff;color:var(--primary);border:2px solid var(--primary)" id="copyBtn" onclick="copyResults()">复制成绩（备用）</button>'+
        '<button class="vbtn" style="background:#fff;color:var(--primary);border:2px solid var(--primary)" onclick="closeStats()">返回课程</button>';
  el.innerHTML=html;
  el.style.display='flex';
}
function closeStats(){ document.getElementById('stats').style.display='none'; }
function syncToObsidian(){
  const txt='\n'+buildReport()+'\n';
  const url='obsidian://advanced-uri?vault=Charlotte'
    +'&filepath='+encodeURIComponent('LLM-Wiki/raw/learning/Agent-AI课程/成绩.md')
    +'&mode=append'
    +'&data='+encodeURIComponent(txt);
  window.location.href=url;
}
function copyResults(){
  const txt=buildReport(), btn=document.getElementById('copyBtn');
  const done=()=>{ if(btn) btn.textContent='已复制 ✓ 去 Obsidian 粘贴'; };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  }else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  document.body.removeChild(ta);
}

document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>50) nav(dx<0?1:-1);
},{passive:true});
boot();
</script>
</body>
</html>
